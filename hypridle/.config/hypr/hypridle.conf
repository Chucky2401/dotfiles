# $screen_off = [[ -f ~/.inhib_idle ]] || hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
# $screen_on = [[ -f ~/.inhib_idle ]] || hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })' on && brightnessctl -r
$lock_cmd = pidof hyprlock || hyprlock
$screen_off = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
$screen_on = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })' && brightnessctl -r
$suspend_cmd = systemctl suspend || loginctl suspend

general {
    lock_cmd = $lock_cmd
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = $screen_on
    # inhibit_sleep = 2
}

listener {
    timeout = 300 # 5mins
    on-timeout = loginctl lock-session
    condition_cmd = ~/.config/hypr/hypridle/can_suspend.sh
}

listener {
    timeout = 600 # 10mins
    on-timeout = $screen_off
    on-resume = $screen_on
    condition_cmd = ~/.config/hypr/hypridle/can_suspend.sh
}

